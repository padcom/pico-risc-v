# Once openssh-server is installed: root logs in without a password, as on
# the console. Only this machine can connect: npm start forwards
# localhost:2222 (not other interfaces) to port 22 here:
#
#   ssh -p 2222 root@localhost
#
# For anything else, set a password or put your public key in
# /root/.ssh/authorized_keys, and delete this file.
PermitRootLogin yes
PermitEmptyPasswords yes
