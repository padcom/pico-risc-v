# Initrds with just the modules this machine needs to mount its root file
# system (the image's own has nearly every storage driver: 41 MB, seconds to
# unpack and scan at every boot on an emulated CPU). Applies when Debian
# regenerates the initrd, e.g. for a new kernel; linux/debian/build.sh trims
# the one the image comes with to the same.
MODULES=dep
