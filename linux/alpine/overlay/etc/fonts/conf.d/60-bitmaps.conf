<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  X's own fonts (font-misc-misc) are the only ones here, and they're bitmaps,
  which fontconfig leaves out by default (70-no-bitmaps*.conf): it would have
  none, and Fluxbox can't do without one. Bitmaps are in.
-->
<fontconfig>
  <selectfont>
    <acceptfont>
      <pattern>
        <patelt name="scalable"><bool>false</bool></patelt>
      </pattern>
    </acceptfont>
  </selectfont>
</fontconfig>
