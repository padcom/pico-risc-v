# X on the emulator's screen, with its keyboard and mouse (a tablet). There's
# no udev to find them: they're named here (and evdev drives them: libinput
# needs udev). (The keyboard comes first: it's first in the device tree.)
# The GPU's section, 20-gpu.conf, is written when X starts
# (/etc/profile.d/desktop.sh): its card's number isn't known before.
Section "ServerFlags"
    Option "AutoAddDevices" "false"
EndSection

# No 3D: there's nothing to do it with (Mesa's drivers are left out).
Section "Module"
    Disable "glx"
EndSection

Section "InputDevice"
    Identifier "keyboard"
    Driver "evdev"
    Option "Device" "/dev/input/event0"
EndSection

Section "InputDevice"
    Identifier "tablet"
    Driver "evdev"
    Option "Device" "/dev/input/event1"
EndSection

Section "ServerLayout"
    Identifier "emulator"
    InputDevice "keyboard" "CoreKeyboard"
    InputDevice "tablet" "CorePointer"
EndSection
