<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>risc-emulator</title>
    <link rel="stylesheet" href="xterm/css/xterm.css" />
    <style>
      html, body { height: 100%; margin: 0; background: #000; color: #ccc; font: 13px system-ui, sans-serif; }
      body { display: flex; flex-direction: column; }
      [hidden] { display: none !important; }
      /* The screen or the terminal, filling what the status bar leaves. */
      #views { flex: 1; min-height: 0; position: relative; }
      #screen-view { position: absolute; inset: 0; background: #000; }
      #screen { display: block; width: 100%; height: 100%; object-fit: contain; outline: none; touch-action: none; }
      #terminal { position: absolute; inset: 0; padding: 4px; }
      #bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 2px 8px; background: #222; }
      #bar a { color: #8cf; }
      #view-switch { display: flex; gap: 4px; }
      #view-switch button { font: inherit; color: #ccc; background: #333; border: 1px solid #444; border-radius: 3px; padding: 0 8px; cursor: pointer; }
      #view-switch button[aria-pressed="true"] { color: #fff; background: #357; border-color: #58a; }
    </style>
    <!-- The emulator's modules (dist/) import xterm.js by name. (Paths are
         relative to the page, so it works from anywhere it's served.) -->
    <script type="importmap">
      {
        "imports": {
          "@xterm/xterm": "./xterm/lib/xterm.mjs",
          "@xterm/addon-fit": "./xterm-fit/lib/addon-fit.mjs"
        }
      }
    </script>
    <script type="module" src="dist/browser.js"></script>
  </head>
  <!-- What to boot (see src/browser.ts); npm run web gives it a network. -->
  <body data-distribution="debian" data-network>
    <main id="views">
      <div id="screen-view" hidden><canvas id="screen" tabindex="0"></canvas></div>
      <div id="terminal"></div>
    </main>
    <div id="bar">
      <span id="view-switch" hidden>
        <button id="show-screen" title="The screen (keys and mouse go to it)">Screen</button>
        <button id="show-terminal" title="The terminal (the serial port and the console)">Terminal</button>
        <button id="fullscreen" title="The screen, full screen (Esc leaves)">Full screen</button>
      </span>
      <span id="status">starting…</span><span id="disk"></span><span id="network"></span>
    </div>
  </body>
</html>
