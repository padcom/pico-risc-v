<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>risc-emulator</title>
    <link rel="stylesheet" href="xterm/css/xterm.css" />
    <style>
      html, body { height: 100%; margin: 0; background: #000; color: #ccc; font: 13px system-ui, sans-serif; }
      body { display: flex; flex-direction: column; }
      #screen { flex: none; align-self: center; max-width: 100%; max-height: 65vh; object-fit: contain; outline: none; touch-action: none; }
      #screen:focus { box-shadow: 0 0 0 1px #8cf; }
      #terminal { flex: 1; min-height: 0; padding: 4px; }
      #bar { display: flex; justify-content: space-between; gap: 16px; padding: 2px 8px; background: #222; }
      #bar a { color: #8cf; }
    </style>
    <!-- The emulator's modules (dist/) import xterm.js by name. (Paths are
         relative to the page, so it works from anywhere it's served.) -->
    <script type="importmap">
      {
        "imports": {
          "@xterm/xterm": "./xterm/lib/xterm.mjs",
          "@xterm/addon-fit": "./xterm-fit/lib/addon-fit.mjs"
        }
      }
    </script>
    <script type="module" src="dist/browser.js"></script>
  </head>
  <!-- What to boot (see src/browser.ts); npm run web gives it a network. -->
  <body data-distribution="debian" data-network>
    <canvas id="screen" tabindex="0" hidden></canvas>
    <div id="terminal"></div>
    <div id="bar"><span id="status">starting…</span><span id="disk"></span><span id="network"></span></div>
  </body>
</html>
