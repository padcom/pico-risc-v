# Publishes the emulator as a static web site on GitHub Pages: Alpine Linux
# booting in the page (npm run site, see linux/README.md), on every push to
# main. The repository's Pages settings must say to deploy from "GitHub
# Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces one waiting to run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Rust, for WebAssembly (the CPU core)
        run: rustup target add wasm32-unknown-unknown
      - run: npm ci
      # In a Podman container (Podman comes with GitHub's Ubuntu runners).
      - name: Alpine Linux
        run: npm run alpine:build
      - name: The site
        run: npm run site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
