# Publishes the emulator as a static web site on GitHub Pages: Debian
# booting in the page (npm run site, see linux/README.md), on every push to
# main. The repository's Pages settings must say to deploy from "GitHub
# Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces one waiting to run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    # (Building Debian's image, when it isn't in the cache, takes a while.)
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Rust, for WebAssembly (the CPU core)
        run: rustup target add wasm32-unknown-unknown
      - run: npm ci
      # Debian's image takes long to build (in a Podman container, which
      # GitHub's Ubuntu runners have, then apt in the emulator): it's kept
      # in the cache, and built again only when what it's built from
      # (linux/debian/) changes. (Its disk is 8 GB, most of it holes: a tar
      # that keeps them.)
      - id: debian
        name: What Debian's image is built from
        run: echo "hash=$(bash linux/inputs-hash.sh debian)" >>"$GITHUB_OUTPUT"
      - id: cached
        uses: actions/cache/restore@v6
        with:
          path: debian.tar
          key: debian-${{ steps.debian.outputs.hash }}
      - name: Debian, from the cache
        if: steps.cached.outputs.cache-hit == 'true'
        run: tar --sparse -xf debian.tar && rm debian.tar
      - name: Debian, built
        if: steps.cached.outputs.cache-hit != 'true'
        run: npm run debian:build && tar --sparse -cf debian.tar images/debian
      - if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: debian.tar
          key: debian-${{ steps.debian.outputs.hash }}
      - name: The site
        run: npm run site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          # (.nojekyll: hidden files are left out unless asked for.)
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
